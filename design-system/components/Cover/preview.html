<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio Suno Glass</title>
<style>
  html, body { margin:0; height:100%; }
  body { overflow:hidden; }
  body::before { display:none; }
  .cv { position:relative; height:288px; overflow:hidden; background:var(--bg); }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:520px; height:288px; }
  .accent { fill:var(--accent); }
  .tintv { fill:var(--bg-tint-violet); }
  .tintt { fill:var(--bg-tint-teal); }
  .deep { fill:var(--text); }
  .pane { fill:var(--glass-strong); stroke:var(--glass-border); stroke-width:1; }
  .blk { rx:var(--radius-lg); }
  .bar { rx:var(--radius-sm); }
  .bar.a { fill:var(--accent); }
  .bar.t { fill:var(--bg-tint-violet); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:104px; line-height:.92; font-weight:700; letter-spacing:-.03em; color:var(--text); }
  .tag { margin:var(--space-2) 0 0 4px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--muted); }
</style>
</head>
<body>
<div class="cv">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 520 288" width="520" height="288">
<!--
  blocks      accent 176×264 bled off the top (the one brand hue, largest) · text 304×232 bleeding off the right edge (the deep) · bg-tint-violet 128×152 and bg-tint-teal 128×96 (the ambient tints the glass refracts) — about 40% of 960×288
  arrangement one tall accent slab left of the box, a teal/violet stack beside it, the deep slab behind everything on the right; two glass-strong panes with glass-border edges overlap the seams so the translucency is the picture
  pattern     pills, from "soft, large radii" and the lyric motif of the product: ten vertical pills at a space-6 pitch read as a level meter, cut from accent and bg-tint-violet on the deep slab
  scales      sides in space-4 multiples (16); gutters space-4; pitch space-6; pill width space-2 ... rx radius-sm; block corners radius-lg; pane corners radius-lg
-->
<rect class="deep blk" x="208" y="32" width="304" height="232" rx="22"/>
<rect class="accent blk" x="16" y="-24" width="176" height="264" rx="22"/>
<rect class="tintt blk" x="208" y="-24" width="128" height="96" rx="22"/>
<rect class="tintv blk" x="208" y="88" width="128" height="152" rx="22"/>
<rect class="bar a" x="360" y="160" width="8" height="80" rx="4"/>
<rect class="bar t" x="384" y="120" width="8" height="120" rx="4"/>
<rect class="bar a" x="408" y="88" width="8" height="152" rx="4"/>
<rect class="bar t" x="432" y="136" width="8" height="104" rx="4"/>
<rect class="bar a" x="456" y="104" width="8" height="136" rx="4"/>
<rect class="bar t" x="480" y="168" width="8" height="72" rx="4"/>
<rect class="bar a" x="504" y="128" width="8" height="112" rx="4"/>
<rect class="pane blk" x="120" y="144" width="232" height="128" rx="22"/>
<rect class="pane blk" x="296" y="56" width="120" height="136" rx="22"/>
</svg>
</div>
<div class="words">
  <h1 class="name">Studio<br>Suno</h1>
  <p class="tag">Glass over a tinted ground, one indigo accent, the platform's own type.</p>
</div>
</div>
</body>
</html>
