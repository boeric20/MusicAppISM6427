<!-- @dsCard group="Overlays" height=400 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Preview</title>
<style>html,body{height:100%}</style></head><body>
<div class="ds-stage" style="justify-content:center;padding:var(--space-6)">
  <div class="dialog" style="display:block">
    <form class="dialog-body" onsubmit="return false">
      <h3>Extend track</h3>
      <p class="muted" style="margin-bottom:var(--space-3)">Dusk Highway (2:48)</p>
      <label class="field"><span class="label">Continue from (seconds)</span><input type="number" value="120"><span class="hint">Suno keeps everything before this point and composes onward.</span></label>
      <label class="switch" style="margin-bottom:var(--space-3)"><input type="checkbox"><span class="track" aria-hidden="true"></span><span>Instrumental</span></label>
      <div class="dialog-actions"><button class="ghost" type="button">Cancel</button><button class="primary small" type="button">Extend</button></div>
    </form>
  </div>
</div>
</body></html>
